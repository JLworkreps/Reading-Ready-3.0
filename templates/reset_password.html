{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="login-wrap" style="max-width:420px;">
  <h1>Reset Password</h1>
  <p class="login-sub">Choose a new password for your account.</p>

  <form method="POST">
    <div class="field">
      <label>New Password</label>
      <div class="password-field">
        <input type="password" name="new_password" id="resetNewPassword" placeholder="At least 8 characters" required minlength="8">
        <button type="button" class="password-toggle-btn" data-target="resetNewPassword" aria-label="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3l18 18"/>
            <path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.4 13.4 0 0 1-3.1 3.9M6.6 6.6C3.4 8.6 1.5 12 1.5 12s3.5 7 10.5 7a10.6 10.6 0 0 0 4.4-.9"/>
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <div class="password-field">
        <input type="password" name="confirm_password" id="resetConfirmPassword" placeholder="Re-enter new password" required minlength="8">
        <button type="button" class="password-toggle-btn" data-target="resetConfirmPassword" aria-label="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3l18 18"/>
            <path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.4 13.4 0 0 1-3.1 3.9M6.6 6.6C3.4 8.6 1.5 12 1.5 12s3.5 7 10.5 7a10.6 10.6 0 0 0 4.4-.9"/>
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="subtle" style="margin-bottom:14px;">Must be at least 8 characters.</p>
    <button type="submit" class="btn" style="width:100%;">Reset Password</button>
  </form>
</div>
{% endblock %}
